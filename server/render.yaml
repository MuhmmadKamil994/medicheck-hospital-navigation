# Render Blueprint — MediCheck API (Node/Express backend)
#
# HOW TO USE (owner clicks, no code):
#   1. Push the `server/` folder to its own GitHub repo (see DEPLOY_GUIDE.md).
#   2. Render dashboard -> New -> Blueprint -> connect that repo.
#   3. Render reads THIS file and creates the web service automatically.
#   4. When prompted, paste the values marked `sync: false` below.
#      JWT_SECRET is auto-generated by Render (generateValue) — nothing to paste.
#   5. After the frontend is on Vercel, paste its URL into CORS_ORIGIN.
#
# Nothing secret lives in this file. Real values are entered in the
# Render dashboard and stored by Render, never in git.

services:
  - type: web
    name: medicheck-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # --- paste in dashboard (sync: false) ---
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # --- auto-generated by Render, nothing to paste ---
      - key: JWT_SECRET
        generateValue: true
      # --- safe defaults, no action needed ---
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_TIMEOUT_MS
        value: "5000"
      - key: SMS_PROVIDER
        value: demo
      - key: ENABLE_REMINDERS
        value: "true"
      - key: SEED_ON_BOOT
        value: "true"
